[project]
name = "decisions-mcp"
version = "0.1.0"
description = "General-purpose classification tools backed by the OpenAI Decisions API"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "httpx>=0.28,<1", "pydantic>=2.11,<3", "python-dotenv>=1,<2"]

[project.scripts]
decisions-mcp = "decisions_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
